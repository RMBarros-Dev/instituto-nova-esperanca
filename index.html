  <script>
    (function () {
      var supported = ['pt-BR', 'en-US', 'es-ES', 'fr-FR', 'de-DE', 'ja-JP'];
      var target = 'pt-BR';

      // 1. Preferência salva no localStorage
      try {
        var saved = localStorage.getItem('ine_current_lang');
        if (saved && supported.indexOf(saved) !== -1) {
          target = saved;
        } else {
          // 2. Detecção pelo navegador
          var nav = (navigator.language || navigator.userLanguage || '').toLowerCase();
          var prefix = nav.substring(0, 2);
          var map = { 'en': 'en-US', 'es': 'es-ES', 'fr': 'fr-FR', 'de': 'de-DE', 'ja': 'ja-JP', 'pt': 'pt-BR' };
          if (map[prefix]) target = map[prefix];
        }
      } catch (e) {}

      var search = window.location.search || '';
      var hash = window.location.hash || '';
      window.location.replace(target + '/index.html' + search + hash);
    })();
  </script>

    .lang-grid {

    .lang-option-btn {

    .lang-option-btn:hover {

    .lang-name {
