name: Instituto quality

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: instituto-quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: QA, internationalization and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run project QA checks
        run: npm run qa

      - name: Validate translations
        run: npm run test:i18n

      - name: Build published pages and assets
        run: npm run build
