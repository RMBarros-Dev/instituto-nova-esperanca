<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%" preserveAspectRatio="xMidYMid slice">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#075E54" />
      <stop offset="100%" stop-color="#043F39" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#E76F51" />
      <stop offset="100%" stop-color="#F4A261" />
    </linearGradient>
    <filter id="softShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="8" stdDeviation="12" flood-opacity="0.25" flood-color="#000" />
    </filter>
  </defs>
  
  <rect width="800" height="450" fill="url(#bgGrad)" />
  
  <!-- Subtle organic decorative elements -->
  <circle cx="700" cy="80" r="180" fill="rgba(255,255,255,0.06)" />
  <circle cx="750" cy="380" r="140" fill="rgba(255,255,255,0.04)" />
  <path d="M-50 400 Q 200 320, 450 380 T 850 350 L 850 450 L -50 450 Z" fill="rgba(0,0,0,0.15)" />

  <!-- Central Visual Symbol / Badge -->
  <g transform="translate(400, 160)" text-anchor="middle">
    <circle cx="0" cy="0" r="55" fill="rgba(255,255,255,0.15)" filter="url(#softShadow)" />
    <circle cx="0" cy="0" r="45" fill="rgba(255,255,255,0.9)" />
    <text x="0" y="16" font-size="44" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif">📚</text>
  </g>

  <!-- Territory / Tag -->
  <g transform="translate(400, 255)">
    <rect x="-90" y="-14" width="180" height="28" rx="14" fill="url(#accentGrad)" />
    <text x="0" y="5" fill="#FFFFFF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="12" font-weight="700" letter-spacing="1" text-anchor="middle">EDUCAÇÃO</text>
  </g>

  <!-- Typography -->
  <text x="400" y="315" fill="#FFFFFF" font-family="'Plus Jakarta Sans', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="24" font-weight="800" text-anchor="middle" filter="url(#softShadow)">Novos Caminhos</text>
  <text x="400" y="348" fill="rgba(255,255,255,0.85)" font-family="'Source Sans 3', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="14" font-weight="500" text-anchor="middle">Reforço Escolar, Letramento & Robótica Comunitária</text>

  <!-- Watermark -->
  <text x="400" y="425" fill="rgba(255,255,255,0.4)" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif" font-size="11" font-weight="600" text-anchor="middle" letter-spacing="2">INSTITUTO NOVA ESPERANÇA • V7.2+</text>
</svg>